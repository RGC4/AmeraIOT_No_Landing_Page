name: Security audit

# Catches new high/critical dependency advisories early, before they quietly
# pile up. Runs on every push and pull request, plus a weekly schedule so newly
# published advisories against the existing lockfile are surfaced even when no
# code changes.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: npm audit (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm run audit:security
